{% extends "base.html" %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
        <h1 class="h3 mb-1">Operator dashboard</h1>
        <p class="text-body-secondary mb-0">ClickMeeting downloader status, attention queue and history.</p>
    </div>
</div>

<div id="current-activity"
     hx-get="/current"
     hx-trigger="every 2s"
     hx-swap="innerHTML">
    {% include "_current_activity.html" %}
</div>

<div id="attention-queue"
     hx-get="/attention"
     hx-trigger="every 5s"
     hx-swap="innerHTML">
    {% include "_attention.html" %}
</div>

<div id="record-browser">
    {% include "_record_browser.html" %}
</div>
{% endblock %}
