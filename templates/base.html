<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CMDownloaderUI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        body { background: var(--bs-tertiary-bg); }
        .attention-row { border-left: .3rem solid var(--bs-danger); }
        .htmx-indicator { opacity: 0; transition: opacity 120ms ease-in; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">CMDownloaderUI</span>
        <span class="badge text-bg-secondary">Read only</span>
    </div>
</nav>
<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
<div class="modal fade" id="recording-details-modal" tabindex="-1" aria-labelledby="recording-details-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="recording-details-title">Recording details</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="recording-details-body" aria-live="polite"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.detail.target && event.detail.target.id === "recording-details-body") {
        bootstrap.Modal.getOrCreateInstance(document.getElementById("recording-details-modal")).show();
    }
});
</script>
</body>
</html>
