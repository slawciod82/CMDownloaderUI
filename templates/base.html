<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CMDownloaderUI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        body { background: var(--bs-tertiary-bg); }
        .attention-row { border-left: .3rem solid var(--bs-danger); }
        .htmx-indicator { opacity: 0; transition: opacity 120ms ease-in; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">CMDownloaderUI</span>
        <span class="badge text-bg-secondary">Read only</span>
    </div>
</nav>
<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
